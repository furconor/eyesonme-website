<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyesOn Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d12;
            --text-color: #ffffff;
            --eom-gradient: linear-gradient(135deg, #FF0080 0%, #7928CA 100%);
            --eoc-gradient: linear-gradient(135deg, #D4AF37 0%, #1A1A1A 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 0, 128, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            position: relative;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .cards-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cards-grid a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card {
            width: 320px;
            height: 420px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s;
            overflow: hidden;
            flex-shrink: 0;
        }

        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card:hover .icon-box {
            transform: scale(1.1);
        }

        .eom .icon-box {
            background: var(--eom-gradient);
        }

        .eoc .icon-box {
            background: var(--eoc-gradient);
        }

        .app-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .app-desc {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 30px;
            flex-grow: 1;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        .eom .btn {
            background: var(--eom-gradient);
            color: white;
        }

        .eoc .btn {
            background: var(--eoc-gradient);
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .bg-mesh {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.2;
            pointer-events: none;
        }

        .mesh-1 {
            background: #FF0080;
            top: -200px;
            left: -200px;
        }

        .mesh-2 {
            background: #D4AF37;
            bottom: -200px;
            right: -200px;
        }
    </style>
</head>

<body>
    <div class="bg-mesh mesh-1"></div>
    <div class="bg-mesh mesh-2"></div>

    <div class="container">
        <h1>EyesOn Portal</h1>
        <p class="subtitle">Uygulama destek ve bilgi merkezine hoş geldiniz.</p>

        <div class="cards-grid">
            <a href="eyesonme.html">
                <div class="card eom">
                    <div class="icon-box">
                        <img src="eye_logo.png" alt="EyesOnMe Logo">
                    </div>
                    <div class="app-name">EyesOnMe</div>
                    <div class="app-desc">
                        Fotoğraflar ve kısa videolar paylaş, oylamalara katıl ve liderlik tablosunun zirvesine
                        yerleş!
                    </div>
                    <button class="btn">İncele</button>
                </div>
            </a>

            <a href="eyesoncampus.html">
                <div class="card eoc">
                    <div class="icon-box">
                        <img src="app_logo.jpeg" alt="EyesOnCampus Logo">
                    </div>
                    <div class="app-name">EyesOnCampus</div>
                    <div class="app-desc">
                        Sadece üniversite öğrencilerine özel sosyal platform. Kampüs duyuruları, etkinlikler ve öğrenci
                        toplulukları.
                    </div>
                    <button class="btn">İncele</button>
                </div>
            </a>
        </div>
    </div>
</body>

</html>
