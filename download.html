<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyesOnMe - Uygulamayı İndir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --primary-gradient: linear-gradient(135deg, #FF3366 0%, #9933FF 100%); --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #FFFFFF; --text-muted: #A0A0A0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .glow { position: absolute; width: 80vw; height: 80vw; filter: blur(120px); z-index: -1; opacity: 0.4; border-radius: 50%; }
        .glow-1 { top: -20%; left: -20%; background: radial-gradient(circle, #FF3366 0%, transparent 70%); animation: float 15s infinite alternate ease-in-out; }
        .glow-2 { bottom: -20%; right: -20%; background: radial-gradient(circle, #9933FF 0%, transparent 70%); animation: float 18s infinite alternate-reverse ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
        
        .container { max-width: 400px; width: 90%; text-align: center; z-index: 10; }
        .logo-img { width: 90px; height: 90px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 1.5rem; background: var(--primary-gradient); padding: 4px; }
        .app-name { font-size: 2.5rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .tagline { color: var(--text-muted); font-weight: 300; margin-top: 0.5rem; font-size: 1.1rem; }
        
        .links-container { display: flex; flex-direction: column; gap: 1rem; margin-top: 2.5rem; }
        
        .store-button { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            gap: 16px; 
            padding: 12px 24px; 
            border-radius: 14px; 
            text-decoration: none; 
            color: #fff; 
            background: #000;
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
            width: 100%;
        }

        .store-button:hover {
            transform: translateY(-2px);
            border-color: #FF3366;
        }

        .store-button.highlight {
            border-color: #FF3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.2);
        }

        .icon { width: 30px; height: 30px; flex-shrink: 0; fill: #fff; }
        .button-text-container { text-align: left; }
        .button-subtitle { display: block; font-size: 0.65rem; font-weight: 500; opacity: 0.6; text-transform: uppercase; margin-bottom: -1px; }
        .button-text { display: block; font-size: 1.15rem; font-weight: 700; }

        footer { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }
        #detect-msg { margin-top: 1.2rem; font-size: 0.85rem; color: #FF3366; font-weight: 600; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="logo-container">
            <img src="eye_logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1 class="app-name">EyesOnMe</h1>
            <p class="tagline">Visual Social Discovery</p>
        </div>
        
        <div class="links-container">
            <!-- App Store -->
            <a href="https://apps.apple.com/tr/app/eyesonme/id6759520834?l=tr" id="ios-link" class="store-button">
                <!-- KUSURSUZ APPLE LOGOSU -->
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.66.806-3.522 1.818-.753.869-1.414 2.336-1.231 3.712 1.348.104 2.684-.738 3.508-1.7z"/>
                </svg>
                <div class="button-text-container">
                    <span class="button-subtitle">Download on the</span>
                    <span class="button-text">App Store</span>
                </div>
            </a>

            <!-- Google Play -->
            <a href="https://play.google.com/store/apps/details?id=space.eyesonme.eyesonme" id="android-link" class="store-button">
                <!-- KUSURSUZ PLAY STORE LOGOSU -->
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.523 15.308L14.594 12.379L17.523 9.45L20.452 11.14C21.438 11.71 21.438 13.049 20.452 13.618L17.523 15.308ZM3.338 1.353C3.125 1.426 3 1.639 3 1.884V22.116C3 22.361 3.125 22.574 3.338 22.647L12.905 12.379L3.338 1.353ZM14.07 11.232L4.654 1.214C4.85 1.109 5.093 1.109 5.289 1.214L15.307 7.025L14.07 11.232ZM14.07 13.526L15.307 17.733L5.289 23.544C5.093 23.649 4.85 23.649 4.654 23.544L14.07 13.526Z"/>
                </svg>
                <div class="button-text-container">
                    <span class="button-subtitle">Get ıt on</span>
                    <span class="button-text">Google Play</span>
                </div>
            </a>
        </div>
        
        <p id="detect-msg">İşte sizin için doğru adres!</p>
    </div>

    <footer>&copy; 2026 EyesOn Network</footer>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const iosLink = document.getElementById('ios-link');
        const androidLink = document.getElementById('android-link');
        const msg = document.getElementById('detect-msg');
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) { 
            iosLink.classList.add('highlight'); msg.style.opacity = '1'; 
        } else if (/android/i.test(userAgent)) { 
            androidLink.classList.add('highlight'); msg.style.opacity = '1'; 
        }
    </script>
</body>
</html>
