<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyesOnMe - Uygulamayı İndir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --primary-gradient: linear-gradient(135deg, #FF3366 0%, #9933FF 100%); --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #FFFFFF; --text-muted: #A0A0A0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .glow { position: absolute; width: 80vw; height: 80vw; filter: blur(120px); z-index: -1; opacity: 0.4; border-radius: 50%; }
        .glow-1 { top: -20%; left: -20%; background: radial-gradient(circle, #FF3366 0%, transparent 70%); animation: float 15s infinite alternate ease-in-out; }
        .glow-2 { bottom: -20%; right: -20%; background: radial-gradient(circle, #9933FF 0%, transparent 70%); animation: float 18s infinite alternate-reverse ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
        
        .container { max-width: 400px; width: 90%; text-align: center; z-index: 10; }
        .logo-img { width: 100px; height: 100px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 1rem; background: var(--primary-gradient); padding: 5px; }
        .app-name { font-size: 2.5rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .tagline { color: var(--text-muted); font-weight: 300; margin-top: 0.5rem; font-size: 1.1rem; }
        
        .links-container { display: flex; flex-direction: column; gap: 1.2rem; margin-top: 3rem; }
        
        .store-button { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            gap: 14px; 
            padding: 14px 24px; 
            border-radius: 18px; 
            text-decoration: none; 
            color: #fff; 
            background: #000;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            width: 100%;
        }

        .store-button:hover {
            transform: translateY(-3px);
            border-color: #FF3366;
            background: #0a0a0a;
        }

        .store-button.highlight {
            border-color: #FF3366;
            background: rgba(255, 51, 102, 0.05);
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.15);
        }

        .icon { width: 32px; height: 32px; flex-shrink: 0; fill: #fff; }
        .button-text-container { text-align: left; }
        .button-subtitle { display: block; font-size: 0.7rem; font-weight: 400; opacity: 0.6; text-transform: uppercase; margin-bottom: -2px; }
        .button-text { display: block; font-size: 1.2rem; font-weight: 600; }

        footer { position: absolute; bottom: 2rem; font-size: 0.85rem; color: var(--text-muted); }
        #detect-msg { margin-top: 1.5rem; font-size: 0.9rem; color: #FF3366; font-weight: 600; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="logo-container">
            <img src="eye_logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1 class="app-name">EyesOnMe</h1>
            <p class="tagline">Visual Social Discovery</p>
        </div>
        
        <div class="links-container">
            <!-- App Store -->
            <a href="https://apps.apple.com/tr/app/eyesonme/id6759520834?l=tr" id="ios-link" class="store-button">
                <!-- Temiz Apple Logosu -->
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.057 1.125c-.83 0-2.484 1.127-3.834 1.127-1.35 0-2.584-1.077-3.834-1.127-2.1-.082-4.01 1.05-5.074 2.898-2.147 3.738-.553 9.24 1.54 12.275 1.026 1.48 2.24 3.143 3.847 3.091 1.53-.064 2.112-1 3.985-1 1.874 0 2.395 1 4.025.962 1.66-.025 2.71-1.5 3.725-2.993 1.173-1.716 1.66-3.376 1.685-3.468-.04-.012-3.21-1.242-3.255-4.937-.03-3.093 2.52-4.57 2.64-4.634-1.454-2.128-3.682-2.365-4.465-2.414zm-1.874-1.125c-2.3 0-4.3 1.9-4.3 4.3 0 .3 0 .6.1.9 2.1 0 4.1-1.7 4.1-4.1 0-.3 0-.6-.1-1.1z"/>
                </svg>
                <div class="button-text-container">
                    <span class="button-subtitle">Download on the</span>
                    <span class="button-text">App Store</span>
                </div>
            </a>

            <!-- Google Play -->
            <a href="https://play.google.com/store/apps/details?id=space.eyesonme.eyesonme" id="android-link" class="store-button">
                <!-- Temiz Play Store Logosu -->
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 20.29v-16.58c0-.67.43-1.22.79-1.52.36-.3.86-.49 1.22-.52l12.41 6.97-3.39 3.39-9.24 9.24c-.36.03-.86-.22-1.22-.52-.36-.3-.79-.85-.79-1.52zm15.42-9.99c.63.37 2.62 1.52 2.62 1.52l1.39 1.71c0 .76-.76 1.35-1.39 1.72s-2.62 1.51-2.62 1.51l-3.39-3.23 3.39-3.24zm-2.8-2.28l3.01-4.92c0-.01-.25-.22-.62-.22-.37 0-1 .37-1 .37l-8.22 4.75 3.42 3.42 3.41-3.41zm-6.83 6.83l-3.42-3.42 8.22-4.74c.37 0 1-.37 1-.37l3.01 4.92c0 .01-.25.22-.62.22-.37 0-.62-.21-.62-.21l-7.59 3.6z"/>
                </svg>
                <div class="button-text-container">
                    <span class="button-subtitle">Get ıt on</span>
                    <span class="button-text">Google Play</span>
                </div>
            </a>
        </div>
        <p id="detect-msg">Sizin için en uygun olanı seçtik!</p>
    </div>

    <footer>&copy; 2026 EyesOn Network</footer>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const iosLink = document.getElementById('ios-link');
        const androidLink = document.getElementById('android-link');
        const msg = document.getElementById('detect-msg');
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) { 
            iosLink.classList.add('highlight'); msg.style.opacity = '1'; 
        } else if (/android/i.test(userAgent)) { 
            androidLink.classList.add('highlight'); msg.style.opacity = '1'; 
        }
    </script>
</body>
</html>
