<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyesOnMe - Uygulamayı İndir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --primary-gradient: linear-gradient(135deg, #FF3366 0%, #9933FF 100%); --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #FFFFFF; --text-muted: #A0A0A0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .glow { position: absolute; width: 80vw; height: 80vw; filter: blur(120px); z-index: -1; opacity: 0.4; border-radius: 50%; }
        .glow-1 { top: -20%; left: -20%; background: radial-gradient(circle, #FF3366 0%, transparent 70%); animation: float 15s infinite alternate ease-in-out; }
        .glow-2 { bottom: -20%; right: -20%; background: radial-gradient(circle, #9933FF 0%, transparent 70%); animation: float 18s infinite alternate-reverse ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
        .container { max-width: 400px; width: 90%; text-align: center; z-index: 10; }
        .logo-img { width: 100px; height: 100px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 1rem; background: var(--primary-gradient); padding: 5px; }
        .app-name { font-size: 2.5rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .tagline { color: var(--text-muted); font-weight: 300; margin-top: 0.5rem; font-size: 1.1rem; }
        .links-container { display: flex; flex-direction: column; gap: 1.2rem; margin-top: 3rem; }
        .store-button { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px; border-radius: 20px; text-decoration: none; color: #fff; font-weight: 600; font-size: 1.1rem; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .store-button:hover { transform: translateY(-5px) scale(1.02); border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.06); }
        .store-button.highlight { background: var(--primary-gradient); border: none; box-shadow: 0 15px 30px rgba(255, 51, 102, 0.3); }
        .button-subtitle { display: block; font-size: 0.75rem; font-weight: 300; opacity: 0.8; margin-bottom: -2px; }
        .button-text-container { text-align: left; }
        .icon { width: 28px; height: 28px; fill: currentColor; }
        footer { position: absolute; bottom: 2rem; font-size: 0.85rem; color: var(--text-muted); }
        #detect-msg { margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); font-weight: 400; opacity: 1; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="container">
        <div class="logo-container">
            <!-- Logonun yolu sizin deponuza göre 'eye_logo.png' olarak güncellendi -->
            <img src="eye_logo.png" alt="EyesOnMe" class="logo-img" onerror="this.style.display='none'">
            <h1 class="app-name">EyesOnMe</h1>
            <p class="tagline">Visual Social Discovery</p>
        </div>
        <div class="links-container">
            <!-- App Store Link -->
            <a href="https://apps.apple.com/app/eyesonme/id6741122606" id="ios-link" class="store-button">
                <svg class="icon" viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 21.8-88.5 21.8-11.4 0-51.1-20.8-82.9-20.8C75.2 140.3 0 193.3 0 284.4c0 57.5 22.6 123.5 54.5 168 18.2 24.9 59.5 82.4 101.2 81.7 41.2-.7 50.2-26.1 98.4-25.8 45.4.3 54.7 26.1 94.6 25.1 41.2-.7 73.1-46.6 96.1-80.4 17.5-23.7 25.8-37.4 33-47.1-87.1-32.9-102.3-149.3-13.6-189.2V2.1c-19.1 0-42.5 13.1-53.7 26.1-13.6 15.6-21.2 36.3-21.2 56.5z"/></svg>
                <div class="button-text-container"><span class="button-subtitle">Download on the</span><span class="button-text">App Store</span></div>
            </a>
            <!-- Play Store Link -->
            <a href="https://play.google.com/store/apps/details?id=space.eyesonme.eyesonme" id="android-link" class="store-button">
                <svg class="icon" viewBox="0 0 512 512"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
                <div class="button-text-container"><span class="button-subtitle">Get it on</span><span class="button-text">Google Play</span></div>
            </a>
        </div>
        <p id="detect-msg" style="opacity: 0;">Sizin için en uygun olanı seçtik.</p>
    </div>
    <footer>&copy; 2026 EyesOn Network</footer>
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const iosLink = document.getElementById('ios-link');
        const androidLink = document.getElementById('android-link');
        const msg = document.getElementById('detect-msg');
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) { 
            iosLink.classList.add('highlight'); 
            msg.style.opacity = '1'; 
        } else if (/android/i.test(userAgent)) { 
            androidLink.classList.add('highlight'); 
            msg.style.opacity = '1'; 
        }
    </script>
</body>
</html>
